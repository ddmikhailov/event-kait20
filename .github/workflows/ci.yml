name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native MySQL 8.1.0 test binary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age libaio1t64 libnuma1 nginx shellcheck
          archive="$RUNNER_TEMP/mysql-community-server-core.deb"
          curl --fail --location --retry 3 \
            https://cdn.mysql.com/archives/mysql-8.1/mysql-community-server-core_8.1.0-1ubuntu22.04_amd64.deb \
            --output "$archive"
          echo "fda27497acbb2deb2b422c13a6466d9e9c5745a3b4446f13319c2bd3368b41d0  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mysql-8.1.0"
          dpkg-deb --extract "$archive" "$RUNNER_TEMP/mysql-8.1.0"
          echo "MYSQL_HOME=$RUNNER_TEMP/mysql-8.1.0/usr" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mysql-8.1.0/usr/sbin/mysqld" --version | grep --fixed-strings 'Ver 8.1.0'
      - run: python -m pip install -e 'backend[dev]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate native deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/bin/*.sh
          shellcheck deploy/bin/*.sh
          runtime="$RUNNER_TEMP/native-deploy"
          mkdir -p "$runtime"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=web.ci.invalid' \
            -keyout "$runtime/key.pem" -out "$runtime/cert.pem"
          node scripts/verify-native-deploy.mjs \
            --output "$runtime/rendered" \
            --certificate "$runtime/cert.pem" \
            --certificate-key "$runtime/key.pem"
          sudo install -m 0644 "$runtime/rendered/nginx/event-registration-web-security.conf" /etc/nginx/snippets/
          sudo install -m 0644 "$runtime/rendered/nginx/event-registration-scanner-security.conf" /etc/nginx/snippets/
          sudo install -m 0644 "$runtime/rendered/nginx/event-registration.conf" /etc/nginx/conf.d/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          deploy/bin/install-native.sh --rendered-dir "$runtime/rendered" --dry-run
