<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /srv/eventki20/web

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/
    ProxyPassReverse /api/ http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"

    RedirectMatch 302 ^/scanner$ /scanner/
    Alias /scanner/ /srv/eventki20/scanner/

    <Directory /srv/eventki20/web>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <Directory /srv/eventki20/scanner>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /scanner/index.html
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

    <Location /scanner/>
        Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
    </Location>
</VirtualHost>
