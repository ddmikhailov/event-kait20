name: event-registration

x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: mysql://${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@mysql:3306/event_registration
  CORS_ORIGINS: ${PUBLIC_WEB_URL},${PUBLIC_SCANNER_URL}
  SESSION_SECRET: ${SESSION_SECRET}
  AUTH_LINK_SECRET: ${AUTH_LINK_SECRET}
  AUTH_LINK_BASE_URL: ${PUBLIC_WEB_URL}/auth
  QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
  PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_URL}
  CONSENT_URL: ${CONSENT_URL}
  CONSENT_VERSION: ${CONSENT_VERSION}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Регистрация на мероприятие}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

services:
  mysql:
    image: event-registration-mysql:8.1.0-release
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: event_registration
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [private]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    command:
      [
        sh,
        -c,
        'python -m event_api.migrate && uvicorn event_api.main:app --host 0.0.0.0 --port 3000 --workers 2 --proxy-headers --forwarded-allow-ips=${TRUSTED_PROXY_IPS}',
      ]
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    ports: ['127.0.0.1:3000:3000']
    networks: [private]

  email-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    command: [python, -m, event_api.email_worker]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    networks: [private, egress]

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /etc/nginx/conf.d]
    environment:
      API_ORIGIN: ${PUBLIC_API_URL}
    ports: ['127.0.0.1:8080:80']

  scanner:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: scanner
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /etc/nginx/conf.d]
    environment:
      API_ORIGIN: ${PUBLIC_API_URL}
    ports: ['127.0.0.1:8081:80']

networks:
  private:
    internal: true
  egress: {}

volumes:
  mysql_data:
