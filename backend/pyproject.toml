[project]
name = "event-registration-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "openpyxl==3.1.5",
  "pydantic-settings==2.13.1",
  "pymysql==1.1.2",
  "python-multipart==0.0.22",
  "sqlalchemy==2.0.48",
  "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.1.0",
  "ruff==0.15.7",
  "types-openpyxl==3.1.5.20250919",
]

[project.scripts]
event-api = "event_api.main:run"
event-bootstrap-admin = "event_api.bootstrap:main"
event-email-worker = "event_api.email_worker:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["E501", "S101", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["event_api"]
